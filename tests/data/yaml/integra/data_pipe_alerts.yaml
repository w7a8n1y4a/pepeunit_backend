active_period:
  type: "Permanent"

filters:
  type_input_value: "Number"

  max_rate: 0
  last_unique_check: false
  max_size: 50

processing_policy:
  policy_type: "LastValue"

alerts:
  condition: "OutOfRange"
  threshold_min: 10
  threshold_max: 30
  hysteresis: 2
  consecutive_count: 3
  max_frequency: 60
  notify_on_recovery: true
  is_enabled: true
