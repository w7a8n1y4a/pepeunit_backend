[pytest]
addopts = -p no:warnings --maxfail=1
asyncio_mode=auto
log_cli_level = INFO
markers =
    grafana: requires PU_FF_GRAFANA_INTEGRATION_ENABLE
    datapipe: requires PU_FF_DATAPIPE_ENABLE
    last_value: requires PU_FF_DATAPIPE_ENABLE and PU_FF_DATAPIPE_DEFAULT_LAST_VALUE_ENABLE
    telegram: requires PU_FF_TELEGRAM_BOT_ENABLE
    prometheus: requires PU_FF_PROMETHEUS_ENABLE
    private_repo: requires PU_TEST_INTEGRATION_PRIVATE_REPO_ENABLE and private repo JSON