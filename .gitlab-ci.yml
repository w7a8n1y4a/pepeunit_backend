variables:
  DOCKER_IMAGE_TAG: $CI_PIPELINE_IID
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG

# BuildKit is a Go binary. Go 1.24+ offers X25519MLKEM768 in the ClientHello,
# and on this network the handshake to auth.docker.io times out. The setting
# applies only at `buildx create`, so an existing builder is recreated once.
.ensure_multiarch_builder:
  script:
    - |
      BUILDER=multiarch-builder
      CONTAINER="buildx_buildkit_${BUILDER}0"
      if docker buildx inspect "$BUILDER" >/dev/null 2>&1 \
        && docker inspect "$CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -qx 'GODEBUG=tlsmlkem=0'; then
        docker buildx use "$BUILDER"
      else
        docker buildx rm -f "$BUILDER" >/dev/null 2>&1 || true
        docker buildx create --use --name "$BUILDER" --driver docker-container --driver-opt env.GODEBUG=tlsmlkem=0
      fi

# Trivy: pinned version, DB cache lives on the runner host in $HOME/.cache/trivy.
# If ghcr.io is unreachable from the runner, set TRIVY_DB_REPOSITORY and
# TRIVY_JAVA_DB_REPOSITORY (CI/CD variables) to a mirror.
.trivy:
  variables:
    TRIVY_IMAGE: aquasec/trivy:0.76.2
    # Strict mode: gate on MEDIUM and above, unfixed CVEs included
    # (no --ignore-unfixed), comprehensive detection (also reports CVEs that
    # the distro vendor has not confirmed / marked as affected yet).
    TRIVY_SEVERITY_GATE: MEDIUM,HIGH,CRITICAL
  tags:
    - shell-build-runer
  # The shared on-host cache (trivy.db is mmap'ed by bbolt) must never be
  # updated while another Trivy reads it, otherwise: "SIGBUS: bus error".
  # resource_group serializes all Trivy jobs across pipelines.
  resource_group: trivy-cache
  before_script:
    - mkdir -p "$HOME/.cache/trivy"
    - |
      trivy() {
        docker run --rm --user "$(id -u):$(id -g)" \
          -e TRIVY_CACHE_DIR=/cache \
          -e TRIVY_NO_PROGRESS=true \
          -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY \
          -e TRIVY_USERNAME -e TRIVY_PASSWORD \
          -v "$HOME/.cache/trivy:/cache" \
          -v "$CI_PROJECT_DIR:/src" -w /src \
          "$TRIVY_IMAGE" "$@"
      }

.semgrep:
  variables:
    SEMGREP_IMAGE: semgrep/semgrep:1.184.0
    SEMGREP_SEVERITY_GATE: ERROR
    SEMGREP_EXCLUDES: >-
      --exclude .venv --exclude repo_cache --exclude tmp --exclude .git
      --exclude __pycache__ --exclude .ruff_cache --exclude .pytest_cache
      --exclude alembic/versions
  tags:
    - shell-build-runer
  before_script:
    - |
      semgrep() {
        docker run --rm --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e SEMGREP_ENABLE_VERSION_CHECK=0 \
          -e SEMGREP_SEND_METRICS=off \
          -v "$CI_PROJECT_DIR:/src" -w /src \
          "$SEMGREP_IMAGE" semgrep "$@"
      }

stages:
  - build
  - security
  - deploy
  - test
  - tag

# Whole repo: Python deps (uv.lock), Go deps (data_pipe/go.sum), Dockerfiles
# misconfigurations, hardcoded secrets.
security:trivy_repo:
  extends: .trivy
  stage: security
  needs: []
  # Findings turn the job orange (warning) but do not block the pipeline.
  # Remove allow_failure to make the scan blocking again.
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    # 1) full report (all severities, incl. LOW/UNKNOWN), never fails; artifact
    - >
      trivy fs
      --scanners vuln,secret,misconfig
      --detection-priority comprehensive
      --skip-dirs .venv,repo_cache,tmp,.git
      --format json --output trivy-repo.json
      --exit-code 0 .
    # 2) readable log + gate: fail on MEDIUM+ (fixed and unfixed)
    - >
      trivy fs
      --scanners vuln,secret,misconfig
      --detection-priority comprehensive
      --dependency-tree
      --skip-dirs .venv,repo_cache,tmp,.git
      --severity "$TRIVY_SEVERITY_GATE"
      --exit-code 1 .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-repo.json

security:semgrep_repo:
  extends: .semgrep
  stage: security
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - >
      semgrep scan
      --config p/security-audit --config p/secrets
      --config p/python --config p/golang
      --metrics=off --no-git-ignore $SEMGREP_EXCLUDES
      --json-output semgrep-repo.json --quiet . || true
    - >
      semgrep scan
      --config p/security-audit --config p/secrets
      --config p/python --config p/golang
      --metrics=off --no-git-ignore $SEMGREP_EXCLUDES
      --severity "$SEMGREP_SEVERITY_GATE" --error .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep-repo.json

# Final image: OS packages of python:slim + Python/Go deps + data_pipe binary.
security:trivy_image:
  extends: .trivy
  stage: security
  needs: ["build:image:master"]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  script:
    - export TRIVY_USERNAME=$CI_REGISTRY_USER_MAIN TRIVY_PASSWORD=$CI_ACCESS_TOKEN
    - >
      trivy image
      --scanners vuln,secret
      --detection-priority comprehensive
      --format json --output trivy-image.json
      --exit-code 0 "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - >
      trivy image
      --scanners vuln,secret
      --detection-priority comprehensive
      --dependency-tree
      --ignore-unfixed
      --severity "$TRIVY_SEVERITY_GATE"
      --exit-code 1 "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-image.json

build:image:master:
  stage: build
  tags:
    - shell-build-runer
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER_MAIN -p $CI_ACCESS_TOKEN $CI_REGISTRY
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - !reference [.ensure_multiarch_builder, script]
    - docker buildx inspect --bootstrap
  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG --push .

deploy:image:master:
  stage: deploy
  tags:
    - shell-runer
  variables:
    PROJ: pepeunit-backend-dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  before_script:
    - echo $USER
    - echo $PROJ
    - docker login -u $CI_REGISTRY_USER_MAIN -p $CI_ACCESS_TOKEN $CI_REGISTRY
  script:
    - docker pull $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker stop $PROJ || echo $?
    - docker rm $PROJ || echo $?
    - docker run --rm --user root -v /root/pepeunit/repo_cache:/app/repo_cache --entrypoint chown $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG -R 10001:10001 /app/repo_cache
    - docker run -d --name=$PROJ -p 5401:5000 --restart=always -v /root/pepeunit/repo_cache:/app/repo_cache --env-file $ENV_FILE $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker system prune -a -f

module_test:image:master:
  stage: test
  tags:
    - shell-build-runer
  variables:
    PROJ: pepeunit-backend-dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  script:
    - docker build -f DockerfileLoad -t pepeunit-unit-test .
    - docker run --rm --env-file $ENV_FILE pepeunit-unit-test make test-module
    - docker container prune -f
    - docker images -f "dangling=true" -q | xargs -r docker rmi || true

integration_test:image:master:
  stage: test
  tags:
    - shell-build-runer
  variables:
    PROJ: pepeunit-backend-dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: on_success
    - when: never
  before_script:
    - echo "Waiting for the backend to be responsive..."
    - export PU_DOMAIN=$(grep '^PU_DOMAIN=' $ENV_FILE | cut -d '=' -f2)
  script:
    - |
      for i in {1..30}; do
        if curl -s -o /dev/null -w "%{http_code}" https://$PU_DOMAIN/pepeunit/api/v1/instances/current | grep -q "200"; then
          echo "Backend is responsive, continuing..."
          break
        else
          echo "Waiting for backend to respond..."
          sleep 1
        fi
      done
    - docker build -f DockerfileLoad -t pepeunit-integra-test .
    - docker run --rm --env-file $ENV_FILE pepeunit-integra-test make test-integration
    - docker container prune -f
    - docker images -f "dangling=true" -q | xargs -r docker rmi || true

load_test_api:image:master:
  stage: test
  tags:
    - shell-build-runer
  variables:
    PROJ: pepeunit-backend-dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: manual
    - when: never
  before_script:
    - echo "Waiting for the backend to be responsive..."
    - export PU_DOMAIN=$(grep '^PU_DOMAIN=' $ENV_FILE | cut -d '=' -f2)
  script:
    - |
      for i in {1..30}; do
        if curl -s -o /dev/null -w "%{http_code}" https://$PU_DOMAIN/pepeunit/api/v1/instances/current | grep -q "200"; then
          echo "Backend is responsive, continuing..."
          break
        else
          echo "Waiting for backend to respond..."
          sleep 1
        fi
      done
    - docker build -f DockerfileLoad -t pepeunit-load-test .
    - docker run --rm --env-file $ENV_FILE pepeunit-load-test make test-load-rest
    - docker container prune -f
    - docker images -f "dangling=true" -q | xargs -r docker rmi || true

load_test_mqtt:image:master:
  stage: test
  tags:
    - shell-build-runer
  variables:
    PROJ: pepeunit-backend-dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: manual
    - when: never
  before_script:
    - echo "Waiting for the backend to be responsive..."
    - export PU_DOMAIN=$(grep '^PU_DOMAIN=' $ENV_FILE | cut -d '=' -f2)
  script:
    - |
      for i in {1..30}; do
        if curl -s -o /dev/null -w "%{http_code}" https://$PU_DOMAIN/pepeunit/api/v1/instances/current | grep -q "200"; then
          echo "Backend is responsive, continuing..."
          break
        else
          echo "Waiting for backend to respond..."
          sleep 1
        fi
      done
    - docker build -f DockerfileLoad -t pepeunit-load-test .
    - docker run --rm --env-file $ENV_FILE pepeunit-load-test make test-load-mqtt
    - docker container prune -f
    - docker images -f "dangling=true" -q | xargs -r docker rmi || true

tag:
  stage: tag
  tags:
    - shell-main-pc
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - !reference [.ensure_multiarch_builder, script]
    - docker buildx inspect --bootstrap
  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false -t w7a8n1y4a/pepeunit-backend:$CI_COMMIT_TAG --push .
    - 'curl --request POST "https://git.pepemoss.com/api/v4/projects/${CI_PROJECT_ID}/releases" --header "PRIVATE-TOKEN: $CI_ACCESS_TOKEN" --data "name=Release Tag - $CI_COMMIT_TAG" --data "tag_name=$CI_COMMIT_TAG" --data "description=All builds on [Docker Hub](https://hub.docker.com/r/w7a8n1y4a/pepeunit-backend/tags) - $CI_COMMIT_TAG"'
